<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d0221">
<title>Serafim's Birthday — Select</title>
<style>
@font-face{font-family:P2;src:url(../fonts/PressStart2P.ttf) format('truetype');font-display:swap}
:root{--bg:#0d0221;--cyan:#26f7ff;--pink:#ff2bd6;--yellow:#ffe83f;--green:#4dff6a;--ink:#fff4fd;--dim:#b9a6d6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:P2,monospace}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 16px;text-align:center;
 background:radial-gradient(ellipse at 50% 120%,#ff2bd655 0,transparent 60%),linear-gradient(#0d0221,#1a0640 70%,#2b0a52);overflow-x:hidden}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0004 2px 4px)}
.logo{width:min(86vw,420px);height:auto;filter:drop-shadow(0 0 18px #ff2bd688)}
h1{font-size:clamp(14px,4.4vw,22px);color:var(--yellow);text-shadow:3px 3px 0 #000;line-height:1.5}
.menu{display:flex;flex-direction:column;gap:18px;width:min(100%,420px)}
.btn{display:flex;align-items:center;gap:14px;padding:20px 18px;border:4px solid var(--c);color:var(--ink);text-decoration:none;
 font-size:clamp(12px,3.6vw,16px);line-height:1.5;text-align:left;background:#0008;box-shadow:6px 6px 0 #000,0 0 22px color-mix(in srgb,var(--c) 45%,transparent)}
.btn .ar{color:var(--c);visibility:hidden}
.btn:hover .ar,.btn:focus .ar,.btn.sel .ar{visibility:visible;animation:bl .6s steps(1) infinite}
.btn:active{transform:translate(3px,3px);box-shadow:3px 3px 0 #000}
.tg{--c:var(--cyan)}.gal{--c:var(--pink)}
small{font-size:10px;color:var(--dim);line-height:1.8}
@keyframes bl{50%{opacity:0}}
</style>
</head>
<body>
<img class="logo" src="../logo.webp" alt="Serafim's Birthday" width="420" height="152">
<h1>ВЫБЕРИ ДЕЙСТВИЕ</h1>
<nav class="menu">
 <a class="btn tg sel" href="https://t.me/iknyaz21"><span class="ar">▶</span><span>НАПИСАТЬ СЕРАФИМУ</span></a>
 <a class="btn gal" href="../"><span class="ar">▶</span><span>СМОТРЕТЬ ГАЛЕРЕЮ</span></a>
</nav>
<small>21.11.26 — 22.11.26 · ТВЕРЬ</small>
<script>
document.querySelectorAll('.btn').forEach(b=>{b.addEventListener('mouseenter',()=>{document.querySelectorAll('.btn').forEach(x=>x.classList.toggle('sel',x===b))})});
</script>
</body>
</html>
